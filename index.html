<!DOCTYPE html>
<html>
<head>
  <title>Repo Pulse</title>
</head>
<body>
  <h1>Repo Pulse</h1>
  <button id="connect-github">Connect GitHub</button>
  <button id="connect-okta">Connect to Okta</button>
  <p id="status"></p>
  <ul id="repos"></ul>
  <table id="okta-users" hidden>
    <thead>
      <tr>
        <th>First name</th>
        <th>Last name</th>
        <th>Email</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script type="module">
    import Nango from "https://esm.sh/@nangohq/frontend";

    // Point at your local Docker Nango (not cloud)
    const NANGO_API = "http://localhost:3003";
    const NANGO_CONNECT_UI = "http://localhost:3009";

    const status = document.getElementById("status");
    const reposEl = document.getElementById("repos");
    const oktaTable = document.getElementById("okta-users");
    const oktaBody = oktaTable.querySelector("tbody");

    async function loadRepos(connectionId) {
      oktaTable.hidden = true;
      oktaBody.innerHTML = "";
      status.textContent = `Loading repos for connection ${connectionId}...`;
      const res = await fetch(`/api/repos?connection_id=${encodeURIComponent(connectionId)}`);
      if (!res.ok) {
        const err = await res.text();
        status.textContent = `Failed to load repos: ${err}`;
        return;
      }
      const repos = await res.json();
      reposEl.innerHTML = repos
        .map((r) => `<li><a href="${r.url}" target="_blank">${r.name}</a> ⭐ ${r.stars}</li>`)
        .join("");
      status.textContent = `Connected to GitHub via local Nango (${connectionId})`;
    }

    async function loadOktaUsers(connectionId) {
      reposEl.innerHTML = "";
      status.textContent = `Loading Okta users for connection ${connectionId}...`;
      const res = await fetch(`/api/okta/users?connection_id=${encodeURIComponent(connectionId)}`);
      if (!res.ok) {
        const err = await res.text();
        status.textContent = `Failed to load Okta users: ${err}`;
        return;
      }
      const users = await res.json();
      oktaBody.innerHTML = users
        .map(
          (u) =>
            `<tr>
              <td>${u.firstName ?? ""}</td>
              <td>${u.lastName ?? ""}</td>
              <td>${u.email ?? ""}</td>
              <td>${u.status ?? ""}</td>
            </tr>`
        )
        .join("");
      oktaTable.hidden = false;
      status.textContent = `Connected to Okta via local Nango (${connectionId}) — ${users.length} user(s)`;
    }

    async function openConnect(integration, onConnected) {
      status.textContent = `Opening Nango Connect for ${integration}...`;
      if (integration === "github") {
        reposEl.innerHTML = "";
        oktaTable.hidden = true;
        oktaBody.innerHTML = "";
      } else {
        reposEl.innerHTML = "";
        oktaBody.innerHTML = "";
        oktaTable.hidden = true;
      }

      try {
        const sessionRes = await fetch("/api/session", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ integration }),
        });
        const sessionBody = await sessionRes.json();
        if (!sessionRes.ok) {
          const hint = sessionBody.hint ? `\n${sessionBody.hint}` : "";
          throw new Error(`${sessionBody.error || "session failed"}: ${sessionBody.detail || ""}${hint}`);
        }
        const { token } = sessionBody;

        const nango = new Nango({ host: NANGO_API });
        nango.openConnectUI({
          sessionToken: token,
          baseURL: NANGO_CONNECT_UI,
          apiURL: NANGO_API,
          onEvent: (event) => {
            if (event.type === "connect") {
              onConnected(event.payload.connectionId);
            } else if (event.type === "close") {
              if (!status.textContent.startsWith("Connected")) {
                status.textContent = `Connect closed — authorize ${integration} to continue.`;
              }
            } else if (event.type === "error") {
              status.textContent = `Auth error: ${event.payload.errorType} — ${event.payload.errorMessage}`;
            }
          },
        });
      } catch (err) {
        console.error(err);
        status.textContent = `Could not start Connect: ${err.message}`;
      }
    }

    document.getElementById("connect-github").onclick = () =>
      openConnect("github", loadRepos);

    document.getElementById("connect-okta").onclick = () =>
      openConnect("okta", loadOktaUsers);
  </script>
</body>
</html>
